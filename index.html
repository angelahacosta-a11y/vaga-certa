<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaga Certa — vagas para quem ensina</title>
<meta name="description" content="Plataforma de vagas para profissionais de beleza, idiomas e outras áreas de curso, e para escolas que estão contratando.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>

:root{
  --ink:#1C2027;
  --ink-soft:#6B6F76;
  --paper:#F5F6F8;
  --surface:#FFFFFF;
  --line:#E4E5EA;
  --green:#0F6F5C;
  --green-deep:#0B5447;
  --green-soft:#E3EFE9;
  --amber:#C97A1A;
  --amber-soft:#FBEDD6;
  --indigo:#3B4B8C;
  --indigo-soft:#E6E9F5;
  --danger:#B23A2E;
  --danger-deep:#8C2E24;
  --danger-soft:#F7E3DF;
  --radius:18px;
  --shadow-sm:0 1px 2px rgba(20,21,30,0.05);
  --shadow-md:0 1px 2px rgba(20,21,30,0.05), 0 10px 24px -10px rgba(20,21,30,0.14);
  --shadow-lg:0 2px 4px rgba(20,21,30,0.06), 0 20px 36px -14px rgba(20,21,30,0.22);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55;}
#app{min-height:100vh;display:flex;flex-direction:column;}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-0.01em;margin:0;}
.mono{font-family:'IBM Plex Mono',monospace;letter-spacing:0.4px;}
a{color:inherit;}
button{font-family:'Inter',sans-serif;cursor:pointer;}
input,select,textarea{font-family:'Inter',sans-serif;font-size:0.95rem;}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.view-enter{animation:fadeIn .28s ease both;}

.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--line);background:rgba(245,246,248,0.82);backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);flex-wrap:wrap;gap:10px;}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:none;padding:0;}
.brand-badge{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--green),var(--green-deep));box-shadow:0 4px 10px -3px rgba(15,111,92,0.55);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Space Grotesk';font-weight:700;font-size:0.92rem;flex-shrink:0;}
.brand-name{font-family:'Space Grotesk';font-weight:700;font-size:1.2rem;letter-spacing:-0.01em;text-align:left;}
.brand-tag{font-family:'IBM Plex Mono';font-size:0.63rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:1px;text-align:left;}
.topbar-right{display:flex;align-items:center;gap:14px;font-size:0.85rem;flex-wrap:wrap;}
.linklike{background:none;border:none;text-decoration:underline;color:var(--ink);font-size:0.85rem;padding:0;}

main{flex:1;padding:40px 28px 72px;max-width:1080px;margin:0 auto;width:100%;}

.hero{position:relative;padding:48px 0 32px;overflow:hidden;}
.hero::before{content:'';position:absolute;top:-140px;right:-180px;width:460px;height:460px;background:radial-gradient(circle at 30% 30%,rgba(15,111,92,0.20),transparent 60%),radial-gradient(circle at 75% 70%,rgba(59,75,140,0.16),transparent 60%);filter:blur(36px);z-index:0;pointer-events:none;}
.hero > *{position:relative;z-index:1;}
.hero h1{font-size:clamp(1.9rem,4.6vw,3.1rem);line-height:1.08;max-width:740px;}
.hero p.lead{margin-top:16px;max-width:560px;font-size:1.05rem;color:var(--ink-soft);}
.stat-strip{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap;}
.stat{font-family:'IBM Plex Mono';font-size:0.7rem;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 20px;box-shadow:var(--shadow-sm);min-width:150px;}
.stat b{display:block;font-family:'Space Grotesk';font-weight:700;font-size:1.55rem;color:var(--ink);letter-spacing:-0.01em;margin-bottom:2px;}

.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:38px;}
@media (max-width:700px){.choice-grid{grid-template-columns:1fr;}}
.choice-card{border:1px solid var(--line);border-radius:20px;background:var(--surface);padding:28px;cursor:pointer;box-shadow:var(--shadow-md);transition:transform 0.18s ease,box-shadow 0.18s ease;}
.choice-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}
.choice-icon{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.choice-icon svg{width:23px;height:23px;}
.choice-card h2{font-size:1.25rem;}
.choice-card p{color:var(--ink-soft);margin-top:10px;font-size:0.93rem;}
.choice-card .cta{margin-top:18px;font-family:'IBM Plex Mono';font-size:0.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--green);}
.admin-access{margin-top:32px;font-size:0.8rem;color:var(--ink-soft);}

.ticket{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 24px 20px;margin-bottom:16px;box-shadow:var(--shadow-md);transition:transform .18s ease,box-shadow .18s ease;overflow:hidden;}
.ticket::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--accent,var(--ink));}
.ticket:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.ticket-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.ticket-title{font-family:'Space Grotesk';font-weight:700;font-size:1.08rem;}
.ticket-sub{font-family:'IBM Plex Mono';font-size:0.68rem;color:var(--ink-soft);margin-top:3px;text-transform:uppercase;}
.ticket-perf{border-top:1px solid var(--line);margin:15px 0;}
.ticket-body p{margin:6px 0;font-size:0.9rem;}
.ticket-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:10px;}

.tag{display:inline-block;font-family:'IBM Plex Mono';font-size:0.66rem;text-transform:uppercase;padding:4px 11px;border-radius:20px;letter-spacing:0.4px;white-space:nowrap;}
.tag-beleza{background:var(--amber-soft);color:var(--amber);}
.tag-idiomas{background:var(--indigo-soft);color:var(--indigo);}
.tag-outras{background:var(--green-soft);color:var(--green);}
.tag-status-em_analise{background:#EFEAD8;color:#8A6E2F;}
.tag-status-aprovado{background:var(--green-soft);color:var(--green);}
.tag-status-reprovado{background:var(--danger-soft);color:var(--danger);}
.tag-aberta{background:var(--green-soft);color:var(--green);}
.tag-fechada{background:#ECEDF0;color:var(--ink-soft);}

.btn{display:inline-flex;align-items:center;gap:6px;border:none;background:linear-gradient(135deg,var(--green),var(--green-deep));color:#fff;padding:11px 20px;border-radius:12px;font-size:0.84rem;font-weight:600;letter-spacing:0.1px;box-shadow:0 4px 14px -5px rgba(15,111,92,0.5);transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06);box-shadow:0 8px 18px -6px rgba(15,111,92,0.55);}
.btn:active{transform:translateY(0);}
.btn-outline{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none;}
.btn-outline:hover{background:var(--surface);border-color:var(--ink);filter:none;box-shadow:var(--shadow-sm);}
.btn-sm{padding:7px 14px;font-size:0.74rem;}
.btn-danger{background:linear-gradient(135deg,var(--danger),var(--danger-deep));box-shadow:0 4px 14px -5px rgba(178,58,46,0.5);}
.btn-green{background:linear-gradient(135deg,var(--green),var(--green-deep));box-shadow:0 4px 14px -5px rgba(15,111,92,0.5);}
.btn-ghost{border:none;background:none;color:var(--ink-soft);text-decoration:underline;font-weight:400;padding:0;box-shadow:none;}
.btn-ghost:hover{transform:none;filter:none;color:var(--ink);}
.btn[disabled]{opacity:0.5;cursor:not-allowed;transform:none !important;filter:none !important;}

.form-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px;max-width:560px;box-shadow:var(--shadow-md);}
.ia-box{background:var(--indigo-soft);border:1px solid var(--indigo);border-radius:14px;padding:16px;margin-bottom:17px;}
.ia-box textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-family:'Inter',sans-serif;font-size:0.9rem;}
.match-score{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;font-family:'Space Grotesk';font-weight:700;font-size:0.95rem;flex-shrink:0;color:#fff;}
.ia-loading{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-family:'IBM Plex Mono';font-size:0.85rem;padding:20px 0;}
.ia-spinner{width:18px;height:18px;border-radius:50%;border:3px solid var(--indigo-soft);border-top-color:var(--indigo);animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.field{margin-bottom:17px;}
.field label{display:block;font-size:0.72rem;text-transform:uppercase;font-family:'IBM Plex Mono';letter-spacing:0.4px;margin-bottom:7px;color:var(--ink-soft);}
.field input,.field select,.field textarea{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);transition:border-color .15s ease,box-shadow .15s ease;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px rgba(15,111,92,0.13);}
.checkrow{display:flex;gap:14px;flex-wrap:wrap;}
.checkrow label{display:flex;align-items:center;gap:6px;font-size:0.85rem;font-family:'Inter';color:var(--ink);}
.checkrow input{width:auto;}

.avatar{border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);flex-shrink:0;display:block;}
.avatar-placeholder{border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green-deep));color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;flex-shrink:0;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);}
.photo-field-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.photo-field-row input[type=file]{width:auto;border:none;padding:0;font-size:0.8rem;}
.ticket-school{display:flex;align-items:center;gap:10px;}
.discover-section{margin-top:52px;}
.discover-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
.discover-head h2{font-size:1.2rem;}
.mini-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.mini-profile{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 15px;box-shadow:var(--shadow-sm);transition:transform .15s ease,box-shadow .15s ease;}
.mini-profile:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.mini-profile-info{min-width:0;}
.mini-profile-name{font-weight:600;font-size:0.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-profile-sub{font-size:0.76rem;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 6px;}

.tabs{display:flex;gap:12px;margin-bottom:26px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
.tabs-left{display:inline-flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;flex-wrap:wrap;box-shadow:var(--shadow-sm);}
.tab-btn{background:none;border:none;border-radius:10px;padding:9px 16px;font-family:'IBM Plex Mono';font-size:0.7rem;text-transform:uppercase;letter-spacing:0.4px;color:var(--ink-soft);transition:background .15s ease,color .15s ease;}
.tab-btn.active{color:#fff;background:var(--ink);font-weight:600;}

.filters{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:flex-end;}
.filters .field{margin-bottom:0;min-width:160px;}

table{width:100%;border-collapse:separate;border-spacing:0;margin-bottom:32px;font-size:0.85rem;background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-md);}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);}
tbody tr:hover td{background:var(--paper);}
tbody tr:last-child td{border-bottom:none;}
th{font-family:'IBM Plex Mono';font-size:0.66rem;text-transform:uppercase;color:var(--ink-soft);background:var(--paper);}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:32px;}
.stat-card{border:1px solid var(--line);border-radius:16px;padding:17px;background:var(--surface);box-shadow:var(--shadow-sm);}
.stat-card b{display:block;font-family:'Space Grotesk';font-weight:700;font-size:1.65rem;}
.stat-card span{font-size:0.7rem;color:var(--ink-soft);text-transform:uppercase;font-family:'IBM Plex Mono';}

.empty-state{border:1.5px dashed var(--line);border-radius:var(--radius);padding:32px;text-align:center;color:var(--ink-soft);background:rgba(255,255,255,0.4);}
.section-title{margin-bottom:16px;}
.danger-zone{border:1px solid var(--danger-soft);background:var(--danger-soft);border-radius:var(--radius);padding:22px 24px;margin-top:24px;}
.danger-zone h3{color:var(--danger-deep);}
.danger-zone p{color:#8a5048;font-size:0.85rem;}

.toast-root{position:fixed;top:18px;right:18px;left:18px;z-index:999;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none;}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:0.85rem;box-shadow:0 10px 24px -8px rgba(0,0,0,0.35);max-width:340px;}
.toast.error{background:var(--danger-deep);}

.loading-screen{display:flex;align-items:center;justify-content:center;min-height:60vh;font-family:'IBM Plex Mono';color:var(--ink-soft);}

@media (max-width:600px){
  main{padding:28px 16px 56px;}
  .topbar{padding:14px 16px;}
  .hero::before{width:300px;height:300px;top:-100px;right:-120px;}
}

</style>

<body>
<div id="toast-root" class="toast-root"></div>
<div id="app"></div>
<script>
/* ============================================================
   VAGA CERTA — app.js
   Versão "site de verdade": Supabase (banco de dados + arquivos)
   e Netlify Functions (IA e códigos de acesso protegidos).
   ============================================================ */

/* ---------- CONFIGURAÇÃO — preencha com os dados do seu projeto Supabase ---------- */
const SUPABASE_URL = 'https://yytllnwxjvbybzvlndop.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_w0LZYmDTCfogenRp-Tx37Q_B1gxxxz_';
/* As duas linhas acima são públicas por design (são protegidas pelas regras
   de RLS configuradas no banco) — diferente da chave da Anthropic, que
   fica só no servidor (Netlify Function) e nunca aparece aqui. */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ===================== CONSTANTES ===================== */
const AREA_LABELS = {beleza:'Beleza', idiomas:'Idiomas', outras:'Outras áreas'};
const AREA_TAG_CLASS = {beleza:'tag-beleza', idiomas:'tag-idiomas', outras:'tag-outras'};
const AREA_ACCENT = {beleza:'var(--amber)', idiomas:'var(--indigo)', outras:'var(--green)'};
const STATUS_ACCENT = {em_analise:'#C7A84A', aprovado:'var(--green)', reprovado:'var(--danger)'};
const VAGA_STATUS_ACCENT = {aberta:'var(--green)', fechada:'var(--ink-soft)'};
const EXPERIENCIA_OPTS = ['Sem experiência','Até 1 ano','1 a 3 anos','3 a 5 anos','Mais de 5 anos'];
const DISPONIBILIDADE_OPTS = ['Manhã','Tarde','Noite','Integral','Fins de semana'];
const CONTRATO_OPTS = ['CLT','PJ','Freelancer / hora-aula','Estágio','Parceria / voluntariado'];
const STATUS_CAND_LABELS = {em_analise:'Em análise', aprovado:'Aprovado', reprovado:'Não selecionado'};

/* ===================== ESTADO ===================== */
const state = {
  loading:true,
  view:'home',
  activeTab:null,
  session: JSON.parse(localStorage.getItem('vc_session')||'null') || {role:null,id:null},
  professionals:[],
  schools:[],
  vacancies:[],
  applications:[],
  filters:{area:'todas', cidade:''},
  showNovaVagaForm:false,
  showEditProf:false,
  showEditEscola:false,
  selectedVagaFiltro:'todas',
  adminError:'',
  candCodeError:'',
  escolaCodeError:'',
  tempFotoProf:null,      // null = sem alteração | '' = removida | {blob, preview}
  tempFotoEscola:null,
  tempCurriculoProf:null, // null = sem alteração | '' = removida | {file, nome}
  iaMatchVagaId:null,
  iaMatchLoading:false,
  iaMatchResults:null,
  iaMatchError:'',
  adminCodesCache:null
};

function saveSession(){ localStorage.setItem('vc_session', JSON.stringify(state.session)); }

/* ===================== UTILS ===================== */
function uid(){ return 'id_'+Date.now()+'_'+Math.random().toString(36).slice(2,8); }
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDate(iso){
  try{ return new Date(iso).toLocaleDateString('pt-BR'); }catch(e){ return ''; }
}
function formatDateTime(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR')+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){ return ''; }
}
function showToast(msg, type){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast'+(type==='error'?' error':'');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.remove(); }, type==='error'?9000:4200);
}
function markdownToHtml(text){
  if(!text) return '';
  return escapeHtml(text)
    .replace(/^#{1,3} (.+)$/gm, '<strong style="font-size:1rem;display:block;margin:10px 0 4px;">$1</strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '• $1')
    .replace(/\n\n/g, '</p><p style="margin:8px 0;">')
    .replace(/\n/g, '<br>');
}
function whatsappLink(numero){
  if(!numero) return '';
  let digits = String(numero).replace(/\D/g,'');
  if(!digits) return '';
  if(digits.length<=11) digits = '55'+digits;
  return 'https://wa.me/'+digits;
}
function avatarHtml(foto, nome, size){
  size = size || 46;
  if(foto){
    return '<img class="avatar" src="'+foto+'" style="width:'+size+'px;height:'+size+'px;" alt="Foto de perfil">';
  }
  const letra = (nome||'').trim().charAt(0).toUpperCase() || '?';
  return '<div class="avatar-placeholder" style="width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*0.45)+'px;">'+letra+'</div>';
}
function curriculoChipHtml(nome){
  if(!nome) return '<span style="color:var(--ink-soft);font-size:0.85rem;">Nenhum currículo enviado ainda.</span>';
  return '<span class="tag" style="background:var(--indigo-soft);color:var(--indigo);text-transform:none;font-family:Inter,sans-serif;padding:6px 12px;">📄 '+escapeHtml(nome)+'</span>';
}
function codeChipsHtml(codes, kind){
  if(!codes || codes.length===0) return '<span style="color:var(--ink-soft);font-size:0.85rem;">Nenhum código cadastrado.</span>';
  return codes.map(c=>
    '<span class="tag" style="background:var(--surface);color:var(--ink);border:1px solid var(--line);margin:0 8px 8px 0;display:inline-flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;text-transform:none;font-family:\'IBM Plex Mono\';">'+
      escapeHtml(c)+
      '<button type="button" data-action="remove-'+kind+'-code" data-code="'+escapeHtml(c)+'" title="Remover código" style="border:none;background:var(--paper);color:var(--danger);cursor:pointer;font-weight:700;width:20px;height:20px;border-radius:50%;line-height:1;display:inline-flex;align-items:center;justify-content:center;">×</button>'+
    '</span>'
  ).join('');
}

/* ===================== BANCO DE DADOS (Supabase) ===================== */
async function dbList(table){
  const { data, error } = await sb.from(table).select('*').order('created_at', { ascending:false });
  if(error){ console.error('dbList', table, error); showToast('Erro ao carregar "'+table+'": '+error.message, 'error'); return []; }
  return data || [];
}
async function dbInsert(table, row){
  const { data, error } = await sb.from(table).insert(row).select().single();
  if(error) throw error;
  return data;
}
async function dbUpdate(table, id, patch){
  const { data, error } = await sb.from(table).update(patch).eq('id', id).select().single();
  if(error) throw error;
  return data;
}
async function dbDelete(table, id){
  const { error } = await sb.from(table).delete().eq('id', id);
  if(error) throw error;
}
async function uploadToBucket(bucket, fileOrBlob, filename){
  const ext = ((filename||'arquivo').split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'') || 'bin';
  const path = uid()+'.'+ext;
  const { error } = await sb.storage.from(bucket).upload(path, fileOrBlob, { cacheControl:'3600', upsert:false });
  if(error) throw error;
  const { data } = sb.storage.from(bucket).getPublicUrl(path);
  return data.publicUrl;
}

/* ----- mapeamento das linhas do banco (snake_case) para o formato usado nas telas ----- */
function mapProfessional(row){
  return {
    id: row.id, nome: row.nome, area: row.area, especialidade: row.especialidade,
    cidade: row.cidade, experiencia: row.experiencia, disponibilidade: row.disponibilidade,
    whatsapp: row.whatsapp, bio: row.bio || '',
    foto: row.foto_url || '', temCurriculo: !!row.curriculo_url,
    curriculoNome: row.curriculo_nome || '', curriculoUrl: row.curriculo_url || '',
    criadoEm: row.created_at
  };
}
function mapSchool(row){
  return {
    id: row.id, nome: row.nome, area: row.area, cidade: row.cidade,
    responsavel: row.responsavel || '', sobre: row.sobre || '',
    whatsapp: row.whatsapp || '', email: row.email || '',
    foto: row.foto_url || '', criadoEm: row.created_at
  };
}
function mapVacancy(row, schoolsArr){
  const school = schoolsArr.find(s=>s.id===row.school_id);
  return {
    id: row.id, schoolId: row.school_id, schoolNome: school ? school.nome : '(escola removida)',
    titulo: row.titulo, area: row.area, cidade: row.cidade, tipoContrato: row.tipo_contrato,
    faixaSalarial: row.faixa_salarial || '', descricao: row.descricao, requisitos: row.requisitos || '',
    status: row.status, criadoEm: row.created_at
  };
}
function mapApplication(row, profsArr, vagasArr){
  const p = profsArr.find(x=>x.id===row.professional_id);
  const v = vagasArr.find(x=>x.id===row.vacancy_id);
  return {
    id: row.id, vagaId: row.vacancy_id, professionalId: row.professional_id,
    status: row.status, criadoEm: row.created_at,
    professionalNome: p ? p.nome : '(profissional removido)',
    professionalWhatsapp: p ? p.whatsapp : '',
    professionalEspecialidade: p ? p.especialidade : '',
    professionalFoto: p ? p.foto : '',
    professionalTemCurriculo: p ? p.temCurriculo : false,
    professionalCurriculoNome: p ? p.curriculoNome : '',
    schoolId: v ? v.schoolId : '',
    vagaTitulo: v ? v.titulo : '(vaga removida)'
  };
}

async function loadAllData(){
  const [profRows, schoolRows, vacRows, appRows] = await Promise.all([
    dbList('professionals'), dbList('schools'), dbList('vacancies'), dbList('applications')
  ]);
  state.professionals = profRows.map(mapProfessional);
  state.schools = schoolRows.map(mapSchool);
  state.vacancies = vacRows.map(row=>mapVacancy(row, state.schools));
  state.applications = appRows.map(row=>mapApplication(row, state.professionals, state.vacancies));
}

/* ===================== CÓDIGOS DE ACESSO (via Netlify Function) ===================== */
async function checkAccessCode(tipo, codigo){
  try{
    const url = '/.netlify/functions/codes?tipo='+encodeURIComponent(tipo)+'&codigo='+encodeURIComponent(codigo);
    const res = await fetch(url);
    const data = await res.json();
    return data; // {valid:true} | {valid:false, foundIn:'escola'|'candidato'|'admin'|null}
  }catch(err){
    console.error('checkAccessCode', err);
    return { valid:false, error: err.message };
  }
}
async function adminCodesAction(action, payload){
  const adminCode = state.session.role==='admin' ? state.session.adminCode : (payload && payload.adminCode);
  const res = await fetch('/.netlify/functions/codes', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({action, adminCode}, payload||{}))
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || 'Erro ao gerenciar códigos.');
  return data;
}

/* ===================== IA (via Netlify Function) ===================== */
async function callClaudeAPI(prompt, maxTokens){
  let response;
  try{
    response = await fetch('/.netlify/functions/ai', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ prompt, maxTokens: maxTokens||1000 })
    });
  }catch(networkErr){
    throw new Error('Não consegui falar com o servidor de IA ("'+networkErr.message+'"). Confira sua internet e tente de novo.');
  }
  const rawText = await response.text();
  let data;
  try{ data = JSON.parse(rawText); }
  catch(e){ throw new Error('Resposta inválida do servidor (status '+response.status+'): '+rawText.slice(0,200)); }
  if(!response.ok) throw new Error(data.error || ('Erro do servidor (status '+response.status+').'));
  return data.text || '';
}
function parseJsonFromIA(raw){
  const clean = String(raw||'').replace(/```json|```/g,'').trim();
  try{ return JSON.parse(clean); }
  catch(e){ throw new Error('A IA respondeu em um formato que não consegui ler: '+clean.slice(0,200)); }
}

function renderVagaListInto(){
  const container = document.getElementById('vagas-list');
  if(!container) return;
  const {area, cidade} = state.filters;
  let list = state.vacancies.filter(v=>v.status==='aberta');
  if(area && area!=='todas') list = list.filter(v=>v.area===area);
  if(cidade) list = list.filter(v=>v.cidade.toLowerCase().includes(cidade.toLowerCase()));
  list = list.sort((a,b)=> new Date(b.criadoEm)-new Date(a.criadoEm));
  if(list.length===0){
    container.innerHTML = '<div class="empty-state">Nenhuma vaga encontrada com esses filtros. Tente ampliar a busca.</div>';
    return;
  }
  container.innerHTML = list.map(v=>vagaTicketHtml(v)).join('');
}
function vagaTicketHtml(v){
  const already = state.session.role==='professional' && state.applications.some(a=>a.vagaId===v.id && a.professionalId===state.session.id);

    actionBtn = '<button class="btn btn-sm" data-action="candidatar" data-vaga-id="'+v.id+'" '+(already?'disabled':'')+'>'+(already?'Candidatura enviada':'Candidatar-se')+'</button>';

    actionBtn = '<button class="btn btn-sm" data-action="nav" data-view="prof-entry">Cadastre-se para candidatar</button>';

  const waBtn = waLink ? '<a class="btn btn-sm btn-outline" href="'+waLink+'" target="_blank" rel="noopener" data-action="whatsapp-link" style="text-decoration:none;">💬 WhatsApp</a>' : '';

      '</div>'+

    '</div><div class="ticket-perf"></div>'+
    '<div class="ticket-body">'+
      '<p style="margin:0;">'+markdownToHtml(v.descricao)+'</p>'+
      (v.requisitos?'<p style="margin:8px 0 0;"><strong>Requisitos:</strong> '+escapeHtml(v.requisitos)+'</p>':'')+
      '<p class="mono" style="font-size:0.75rem;color:var(--ink-soft)">'+escapeHtml(v.tipoContrato)+(v.faixaSalarial?(' · '+escapeHtml(v.faixaSalarial)):'')+'</p>'+

function iaMatchResultsHtml(){
  if(state.iaMatchLoading){
    return '<div class="ia-loading"><div class="ia-spinner"></div> A IA está analisando os candidatos...</div>';
  }
  if(state.iaMatchError){
    return '<p style="color:var(--danger);font-size:0.82rem;word-break:break-word;">⚠ '+escapeHtml(state.iaMatchError)+'</p>';
  }
  if(state.iaMatchResults===null) return '';
  if(state.iaMatchResults.length===0){
    return '<div class="empty-state">A IA não encontrou candidatos com bom encaixe para essa vaga ainda.</div>';
  }
  return state.iaMatchResults.map(m=>{
    const p = m.prof;
    const score = Math.max(0, Math.min(100, parseInt(m.score,10)||0));
    const scoreColor = score>=80 ? 'var(--green)' : (score>=50 ? 'var(--amber)' : 'var(--ink-soft)');
    const waLink = whatsappLink(p.whatsapp);
    return '<div class="ticket" style="--accent:'+scoreColor+'"><div class="ticket-head">'+
      '<div class="ticket-school">'+avatarHtml(p.foto, p.nome, 44)+
        '<div><div class="ticket-title">'+escapeHtml(p.nome)+'</div><div class="ticket-sub">'+escapeHtml(p.especialidade)+' · '+escapeHtml(p.cidade)+'</div></div>'+
      '</div>'+
      '<span class="match-score" style="background:'+scoreColor+'">'+score+'</span>'+
    '</div><div class="ticket-perf"></div>'+
    '<p style="font-size:0.88rem;">'+escapeHtml(m.motivo||'')+'</p>'+
    '<div class="ticket-foot">'+
      (waLink?'<a class="btn btn-sm btn-outline" href="'+waLink+'" target="_blank" rel="noopener" style="text-decoration:none;">💬 WhatsApp</a>':'')+
      (p.temCurriculo?'<a class="btn btn-sm btn-outline" href="'+p.curriculoUrl+'" target="_blank" rel="noopener" style="text-decoration:none;">📄 Ver currículo</a>':'')+
    '</div></div>';
  }).join('');
}

async function doAssistirPerfilIA(btnEl){
  const formEl = btnEl.closest('form');
  if(!formEl) return;
  const iaBoxEl = btnEl.closest('.ia-box');
  function showIaError(msg){
    let errBox = iaBoxEl ? iaBoxEl.querySelector('.ia-error-box') : null;
    if(!errBox && iaBoxEl){
      errBox = document.createElement('p');
      errBox.className = 'ia-error-box';
      errBox.style.color = 'var(--danger)';
      errBox.style.fontSize = '0.78rem';
      errBox.style.marginTop = '10px';
      errBox.style.wordBreak = 'break-word';
      iaBoxEl.appendChild(errBox);
    }
    if(errBox) errBox.textContent = '⚠ '+msg;
  }
  function clearIaError(){
    const errBox = iaBoxEl ? iaBoxEl.querySelector('.ia-error-box') : null;
    if(errBox) errBox.remove();
  }
  const notasEl = formEl.querySelector('#ia-perfil-notas');
  const notas = notasEl ? notasEl.value.trim() : '';
  if(!notas){ showToast('Escreva algumas notas sobre sua experiência antes de pedir ajuda da IA.', 'error'); return; }
  const nome = (formEl.querySelector('[name="nome"]')||{}).value || '';
  const area = (formEl.querySelector('[name="area"]')||{}).value || '';
  const cidade = (formEl.querySelector('[name="cidade"]')||{}).value || '';
  const experiencia = (formEl.querySelector('[name="experiencia"]')||{}).value || '';
  const especialidadeAtual = (formEl.querySelector('[name="especialidade"]')||{}).value || '';
  const textoOriginal = btnEl.textContent;
  btnEl.disabled = true; btnEl.textContent = 'Pensando...';
  clearIaError();
  try{
    const prompt = 'Você ajuda profissionais de beleza, idiomas e outras áreas de curso a se apresentarem bem numa plataforma de vagas chamada Vaga Certa.\n'+
      'Dados informados:\nNome: '+nome+'\nÁrea: '+area+'\nEspecialidade atual (pode estar vazia): '+especialidadeAtual+'\nCidade: '+cidade+'\nExperiência: '+experiencia+'\nNotas escritas pela própria pessoa: "'+notas+'"\n\n'+
      'Responda APENAS com um JSON válido, sem markdown e sem texto fora do JSON, neste formato exato: {"especialidade": "uma frase curta e clara do cargo/especialidade, no máximo 6 palavras", "bio": "de 2 a 4 frases em português do Brasil, em primeira pessoa, tom profissional e simpático, resumindo a experiência para escolas que estão contratando"}';
    const raw = await callClaudeAPI(prompt, 500);
    const parsed = parseJsonFromIA(raw);
    const espField = formEl.querySelector('[name="especialidade"]');
    const bioField = formEl.querySelector('[name="bio"]');
    if(espField && parsed.especialidade) espField.value = parsed.especialidade;
    if(bioField && parsed.bio) bioField.value = parsed.bio;
    showToast('Sugestão da IA aplicada! Revise e ajuste se quiser antes de salvar.');
  }catch(err){
    console.error('IA perfil', err);
    showIaError(err.message || String(err));
  }finally{
    btnEl.disabled = false; btnEl.textContent = textoOriginal;
  }
}
async function doBuscarCandidatosIA(){
  const sel = document.getElementById('ia-match-select');
  const vagaId = sel ? sel.value : '';
  if(!vagaId){ showToast('Escolha uma vaga primeiro.', 'error'); return; }
  state.iaMatchVagaId = vagaId;
  const v = state.vacancies.find(x=>x.id===vagaId);
  if(!v) return;
  const pool = state.professionals.filter(p=>p.area===v.area).slice(-60);
  if(pool.length===0){
    state.iaMatchResults = [];
    state.iaMatchError = '';
    render();
    showToast('Não há profissionais cadastrados nessa área ainda.', 'error');
    return;
  }
  state.iaMatchLoading = true;
  state.iaMatchResults = null;
  state.iaMatchError = '';
  render();
  try{
    const lista = pool.map(p=>'- id:'+p.id+' | nome:'+p.nome+' | especialidade:'+p.especialidade+' | cidade:'+p.cidade+' | experiência:'+p.experiencia+' | disponibilidade:'+(p.disponibilidade||'-')+' | sobre:'+(p.bio||'-')).join('\n');
    const prompt = 'Você é um recrutador especialista ajudando uma escola a encontrar, entre os candidatos já cadastrados na plataforma Vaga Certa, os mais aderentes a uma vaga.\n\n'+
      'VAGA:\nTítulo: '+v.titulo+'\nÁrea: '+v.area+'\nCidade: '+v.cidade+'\nTipo de contrato: '+v.tipoContrato+'\nDescrição: '+v.descricao+'\nRequisitos: '+(v.requisitos||'não especificado')+'\n\n'+
      'CANDIDATOS DISPONÍVEIS:\n'+lista+'\n\n'+
      'Escolha até 8 candidatos mais aderentes a essa vaga, considerando cidade, experiência e disponibilidade. Responda APENAS com JSON válido, sem markdown e sem texto fora do JSON, no formato exato: {"matches":[{"id":"ID_DO_CANDIDATO","score":0,"motivo":"frase curta em português explicando o motivo do match"}]} — ordenado do melhor pro pior encaixe.';
    const raw = await callClaudeAPI(prompt, 1200);
    const parsed = parseJsonFromIA(raw);
    state.iaMatchResults = (parsed.matches||[]).map(m=>{
      const prof = state.professionals.find(x=>x.id===m.id);
      return prof ? {prof:prof, score:m.score, motivo:m.motivo} : null;
    }).filter(Boolean);
  }catch(err){
    console.error('IA match', err);
    state.iaMatchResults = [];
    state.iaMatchError = err.message || String(err);
  }
  state.iaMatchLoading = false;
  render();
}
/* ===================== UPLOAD DE FOTO / CURRÍCULO ===================== */
function resizeImageForUpload(file, maxDim, quality, callback){
  if(!file) return;
  if(file.size > 15*1024*1024){ showToast('Essa imagem passa de 15 MB. Tente uma foto mais leve.', 'error'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      if(w > h){ if(w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
      else { if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const previewUrl = canvas.toDataURL('image/jpeg', quality);
      canvas.toBlob(function(blob){
        if(!blob){ showToast('Não foi possível processar essa imagem.', 'error'); return; }
        callback(blob, previewUrl);
      }, 'image/jpeg', quality);
    };
    img.onerror = function(){ showToast('Esse formato de imagem não abre no navegador. Se a foto foi tirada num iPhone (formato HEIC), tente enviar um print da foto ou exportá-la como JPG/PNG antes.', 'error'); };
    img.src = e.target.result;
  };
  reader.onerror = function(){ showToast('Não foi possível ler esse arquivo.', 'error'); };
  reader.readAsDataURL(file);
}

async function doCandidatar(vagaId){
  if(state.session.role!=='professional'){ showToast('Cadastre-se como profissional para se candidatar.', 'error'); return; }
  const already = state.applications.some(a=>a.vagaId===vagaId && a.professionalId===state.session.id);
  if(already) return;
  const v = state.vacancies.find(x=>x.id===vagaId);
  const p = state.professionals.find(x=>x.id===state.session.id);
  if(!v || !p) return;
  try{
    const row = await dbInsert('applications', { vacancy_id: vagaId, professional_id: p.id, status: 'em_analise' });
    state.applications.push(mapApplication(row, state.professionals, state.vacancies));
    renderVagaListInto();
    showToast('Candidatura enviada para '+v.schoolNome+'!');
  }catch(err){
    console.error(err);
    if(String(err.message||'').includes('duplicate') || err.code==='23505'){
      showToast('Você já tinha se candidatado a essa vaga.', 'error');
    } else {
      showToast('Não foi possível enviar sua candidatura agora: '+err.message, 'error');
    }
  }
}
async function doAtualizarStatusCand(candId, status){
  try{
    await dbUpdate('applications', candId, { status });
    const a = state.applications.find(x=>x.id===candId);
    if(a) a.status = status;
    render();
    showToast('Status atualizado.');
  }catch(err){ showToast('Não foi possível atualizar o status: '+err.message, 'error'); }
}

async function doReabrirVaga(vagaId){

async function doExcluirVaga(vagaId){
  if(!confirm('Excluir esta vaga e todas as candidaturas relacionadas?')) return;
  try{
    await dbDelete('vacancies', vagaId); // candidaturas somem automaticamente (ON DELETE CASCADE)
    state.vacancies = state.vacancies.filter(v=>v.id!==vagaId);
    state.applications = state.applications.filter(a=>a.vagaId!==vagaId);
    render();
  }catch(err){ showToast('Não foi possível excluir a vaga: '+err.message, 'error'); }
}
async function doExcluirProf(profId){
  if(!confirm('Excluir este profissional e suas candidaturas?')) return;
  try{
    await dbDelete('professionals', profId);
    state.professionals = state.professionals.filter(p=>p.id!==profId);
    state.applications = state.applications.filter(a=>a.professionalId!==profId);
    render();
  }catch(err){ showToast('Não foi possível excluir: '+err.message, 'error'); }
}
async function doExcluirEscola(escolaId){
  if(!confirm('Excluir esta escola, suas vagas e candidaturas relacionadas?')) return;
  try{
    await dbDelete('schools', escolaId);
    const vagaIds = state.vacancies.filter(v=>v.schoolId===escolaId).map(v=>v.id);
    state.schools = state.schools.filter(s=>s.id!==escolaId);
    state.vacancies = state.vacancies.filter(v=>v.schoolId!==escolaId);
    state.applications = state.applications.filter(a=>!vagaIds.includes(a.vagaId));
    render();
  }catch(err){ showToast('Não foi possível excluir: '+err.message, 'error'); }
}
async function doLimparDados(){
  if(!confirm('Isso vai apagar TODOS os profissionais, escolas, vagas e candidaturas desta plataforma. Confirma?')) return;
  try{
    await Promise.all([
      sb.from('applications').delete().not('id','is',null),

        nome: fd.get('nome'), area: fd.get('area'), especialidade: fd.get('especialidade'),
        cidade: fd.get('cidade'), experiencia: fd.get('experiencia'),
        disponibilidade: fd.getAll('disponibilidade').join(', '),
        whatsapp: fd.get('whatsapp'), bio: fd.get('bio') || ''
      };
      if(state.tempFotoProf && typeof state.tempFotoProf==='object'){
        payload.foto_url = await uploadToBucket('avatars', state.tempFotoProf.blob, 'foto.jpg');
      } else if(state.tempFotoProf===''){
        payload.foto_url = null;
      }
      if(state.tempCurriculoProf && typeof state.tempCurriculoProf==='object'){
        payload.curriculo_url = await uploadToBucket('curriculos', state.tempCurriculoProf.file, state.tempCurriculoProf.nome);
        payload.curriculo_nome = state.tempCurriculoProf.nome;
      } else if(state.tempCurriculoProf===''){
        payload.curriculo_url = null; payload.curriculo_nome = null;
      }
      let row;
      if(kind==='prof-editar'){
        row = await dbUpdate('professionals', existingProf.id, payload);
      } else {
        row = await dbInsert('professionals', payload);
      }
      const mapped = mapProfessional(row);
      if(kind==='prof-editar'){
        const idx = state.professionals.findIndex(p=>p.id===mapped.id);
        if(idx>-1) state.professionals[idx] = mapped;
        state.showEditProf = false;
        showToast('Perfil atualizado!');
      } else {
        state.professionals.push(mapped);
        state.session = {role:'professional', id: mapped.id};
        saveSession();
        showToast('Perfil criado! Já dá para ver as vagas abertas.');
      }
      state.tempFotoProf = null; state.tempCurriculoProf = null;
      navigate('prof-painel');
    }catch(err){
      console.error(err);
      showToast('Não foi possível salvar seu perfil: '+err.message, 'error');
      if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = kind==='prof-editar'?'Salvar alterações':'Criar meu perfil'; }
    }
  }

  else if(kind==='escola-cadastro' || kind==='escola-editar'){
    const submitBtn = form.querySelector('button[type="submit"]');
    if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'Salvando...'; }
    try{
      const existingEscola = kind==='escola-editar' ? state.schools.find(s=>s.id===form.dataset.id) : null;
      const payload = {
        nome: fd.get('nome'), area: fd.get('area'), cidade: fd.get('cidade'),
        responsavel: fd.get('responsavel') || '', sobre: fd.get('sobre') || '',
        whatsapp: fd.get('whatsapp') || '', email: fd.get('email') || ''
      };
      if(state.tempFotoEscola && typeof state.tempFotoEscola==='object'){
        payload.foto_url = await uploadToBucket('avatars', state.tempFotoEscola.blob, 'foto.jpg');
      } else if(state.tempFotoEscola===''){
        payload.foto_url = null;
      }
      let row;
      if(kind==='escola-editar'){
        row = await dbUpdate('schools', existingEscola.id, payload);
      } else {
        row = await dbInsert('schools', payload);
      }
      const mapped = mapSchool(row);
      if(kind==='escola-editar'){
        const idx = state.schools.findIndex(s=>s.id===mapped.id);
        if(idx>-1) state.schools[idx] = mapped;
        state.showEditEscola = false;
        showToast('Dados da escola atualizados!');
      } else {
        state.schools.push(mapped);
        state.session = {role:'school', id: mapped.id};
        saveSession();
        showToast('Escola cadastrada! Você já pode publicar vagas.');
      }
      state.tempFotoEscola = null;
      navigate('escola-painel');
    }catch(err){
      console.error(err);
      showToast('Não foi possível salvar os dados da escola: '+err.message, 'error');
      if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = kind==='escola-editar'?'Salvar alterações':'Cadastrar escola'; }
    }
  }

  else if(kind==='nova-vaga'){
    const s = state.schools.find(x=>x.id===state.session.id);
    if(!s){ showToast('Não conseguimos identificar sua escola nesta sessão. Saia e entre de novo.', 'error'); return; }
    const submitBtn = form.querySelector('button[type="submit"]');
    if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'Publicando...'; }
    try{
      const row = await dbInsert('vacancies', {
        school_id: s.id, titulo: fd.get('titulo'), area: fd.get('area'), cidade: fd.get('cidade'),
        tipo_contrato: fd.get('tipoContrato'), faixa_salarial: fd.get('faixaSalarial') || '',
        descricao: fd.get('descricao'), requisitos: fd.get('requisitos') || '', status: 'aberta'
      });
      state.vacancies.unshift(mapVacancy(row, state.schools));
      state.showNovaVagaForm = false;
      render();
      showToast('Vaga publicada!');
    }catch(err){
      console.error(err);
      showToast('Não foi possível publicar a vaga: '+err.message, 'error');
      if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = 'Publicar vaga'; }
    }
  }

  else if(kind==='cand-codigo'){
    const codigo = (fd.get('codigo')||'').trim();
    const result = await checkAccessCode('candidato', codigo);
    if(result.valid){
      state.candCodeError = '';
      navigate('prof-cadastro');
    } else if(result.foundIn){
      state.candCodeError = 'Esse é um código de '+(result.foundIn==='admin'?'administrador':'escola')+', não de candidato. Use um código da lista de candidatos.';
      render();
    } else {
      state.candCodeError = result.error ? ('Não foi possível verificar o código agora: '+result.error) : 'Código inválido. Confira e tente de novo.';
      render();
    }
  }

  else if(kind==='escola-codigo'){
    const codigo = (fd.get('codigo')||'').trim();
    const result = await checkAccessCode('escola', codigo);
    if(result.valid){
      state.escolaCodeError = '';
      navigate('escola-cadastro');
    } else if(result.foundIn){
      state.escolaCodeError = 'Esse é um código de '+(result.foundIn==='admin'?'administrador':'candidato')+', não de escola. Use um código da lista de escolas.';
      render();
    } else {
      state.escolaCodeError = result.error ? ('Não foi possível verificar o código agora: '+result.error) : 'Código inválido. Confira e tente de novo, ou fale com a gente para assinar a plataforma.';
      render();
    }
  }

  else if(kind==='admin-login'){
    const codigo = (fd.get('codigo')||'').trim();
    const result = await checkAccessCode('admin', codigo);
    if(result.valid){
      state.session = {role:'admin', id:null, adminCode: codigo};
      state.adminError = '';
      saveSession();
      navigate('admin-painel');
    } else if(result.foundIn){
      state.adminError = 'Esse é um código de '+result.foundIn+', não de administrador. Use um dos códigos da lista de administrador.';
      render();
    } else {
      state.adminError = result.error ? ('Não foi possível verificar o código agora: '+result.error) : 'Código incorreto.';
      render();
    }
  }

  else if(kind==='add-admin-code' || kind==='add-candidate-code' || kind==='add-escola-code'){
    const tipo = kind==='add-admin-code' ? 'admin' : (kind==='add-candidate-code' ? 'candidato' : 'escola');
    const novo = (fd.get('novoCodigo')||'').trim();
    if(!novo) return;
    try{
      await adminCodesAction('add', { tipo, codigo: novo, adminCode: getCurrentAdminCode() });
      showToast('Código adicionado.');
      form.reset();
      loadAndRenderAdminCodes();
    }catch(err){ showToast('Não foi possível adicionar: '+err.message, 'error'); }
  }
});

document.addEventListener('input', function(e){
  const t = e.target;
  if(t.dataset && t.dataset.filter==='cidade'){
    state.filters.cidade = t.value;
    renderVagaListInto();
  }
});
document.addEventListener('change', function(e){
  const t = e.target;
  if(t.dataset && t.dataset.filter==='area'){
    state.filters.area = t.value;
    render();
    renderVagaListInto();
  }
  if(t.dataset && t.dataset.filter==='vaga-select'){
    state.selectedVagaFiltro = t.value;
    render();
  }
  if(t.dataset && t.dataset.photoInput==='prof'){
    const file = t.files[0];
    resizeImageForUpload(file, 320, 0.85, function(blob, previewUrl){
      state.tempFotoProf = {blob:blob, preview:previewUrl};
      const prev = document.getElementById('prof-photo-preview');
      if(prev) prev.innerHTML = avatarHtml(previewUrl, null, 56);
    });
  }
  if(t.dataset && t.dataset.photoInput==='escola'){
    const file = t.files[0];
    resizeImageForUpload(file, 320, 0.85, function(blob, previewUrl){
      state.tempFotoEscola = {blob:blob, preview:previewUrl};
      const prev = document.getElementById('escola-photo-preview');
      if(prev) prev.innerHTML = avatarHtml(previewUrl, null, 56);
    });
  }
  if(t.dataset && t.dataset.curriculoInput==='prof'){
    const file = t.files[0];
    if(!file) return;
    if(file.size > 8*1024*1024){ showToast('Esse arquivo passa de 8 MB. Tente um arquivo mais leve, ou em PDF.', 'error'); return; }
    state.tempCurriculoProf = {file:file, nome:file.name};
    const prev = document.getElementById('prof-curriculo-preview');
    if(prev) prev.innerHTML = curriculoChipHtml(file.name);
  }
});

init();

</script>
</body>
</html>
